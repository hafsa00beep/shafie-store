<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شافعي ستور - Shafie Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Cairo:wght@400;600;700&family=Tajawal:wght@400;500;700&family=Reem+Kufi:wght@500&family=El+Messiri:wght@600&family=Amiri:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-pink: #ffb7c5;
            --soft-pink: #fff0f3;
            --dark-pink: #d87093;
            --text-color: #4a4a4a;
            --font-family: 'Tajawal', sans-serif;
            --header-font: 'Aref Ruqaa', cursive;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: var(--font-family);
            color: var(--text-color);
            background-image: url('bg.jpg'); /* اسم صورة الخلفية */
            background-size: 200px;
            background-repeat: repeat;
            background-attachment: fixed;
            min-height: 100vh;
            overflow-x: hidden;
            background-color: #fff9fa;
        }

        .by-hafsa {
            position: fixed;
            top: 5px;
            left: 10px;
            font-size: 11px;
            color: #888;
            z-index: 1000;
            font-family: sans-serif;
            background: rgba(255, 255, 255, 0.7);
            padding: 2px 8px;
            border-radius: 10px;
        }

        header {
            text-align: center;
            padding: 15px 10px;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(5px);
            border-bottom: 2px solid rgba(255, 183, 197, 0.5);
            position: relative;
        }

        .store-title {
            font-family: var(--header-font);
            font-size: 34px;
            color: var(--dark-pink);
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.9);
        }

        .admin-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--dark-pink);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 12px;
            font-family: var(--font-family);
        }

        .slider-container {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            width: 100vw;
            height: calc(100vh - 160px);
            -webkit-overflow-scrolling: touch;
        }

        .slider-container::-webkit-scrollbar {
            display: none;
        }

        .page {
            flex: 0 0 100vw;
            width: 100vw;
            scroll-snap-align: start;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 8px 25px rgba(216, 112, 147, 0.15);
            width: 90%;
            max-width: 420px;
            padding: 20px;
            text-align: center;
            margin: auto;
            max-height: 80vh;
            overflow-y: auto;
        }

        .welcome-card h2 {
            color: var(--dark-pink);
            margin-bottom: 12px;
            font-size: 22px;
        }

        .welcome-card p {
            font-size: 16px;
            line-height: 1.6;
            color: #555;
        }

        .product-img {
            width: 100%;
            max-height: 220px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .product-title {
            font-size: 19px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .product-desc {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }

        .product-shipping {
            font-size: 13px;
            color: var(--dark-pink);
            background: rgba(255, 183, 197, 0.25);
            padding: 6px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .order-btn {
            background: linear-gradient(135deg, #ffb7c5, #d87093);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 25px;
            font-size: 15px;
            font-family: var(--font-family);
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(216, 112, 147, 0.3);
        }

        .checkout-container {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.95);
            z-index: 1500;
            padding: 20px;
            overflow-y: auto;
            text-align: right;
        }

        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(5px);
            padding: 10px;
            text-align: center;
            border-top: 1px solid rgba(255, 183, 197, 0.4);
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        footer a {
            color: var(--dark-pink);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        .admin-panel {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.97);
            z-index: 2000;
            padding: 20px;
            overflow-y: auto;
            text-align: right;
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .input-group input, .input-group select, .input-group textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: var(--font-family);
        }

        .close-btn {
            background: #aaa;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 10px;
            margin-top: 10px;
            cursor: pointer;
        }

        .delete-btn {
            background: #ff4d4d;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="by-hafsa">by hafsa hussien</div>

    <header>
        <button class="admin-btn" onclick="openAdminModal()">دخول الأدمن 🔐</button>
        <h1 class="store-title">شافعي ستور</h1>
    </header>

    <div class="slider-container" id="slider">
        <div class="page">
            <div class="glass-card welcome-card">
                <h2>أهلاً بحضرتك يا فندم 🌸</h2>
                <p>متوفر عندنا أرقى وأشيك التشكيلات الخاصة بـ <b>شافعي ستور</b>.<br> اسحبي الشاشة لليمين لتصفح المنتجات والقطع المتاحة لدينا ✨</p>
            </div>
        </div>
    </div>

    <footer>
        <a href="https://facebook.com" target="_blank">فيسبوك</a>
        <a href="https://wa.me/" target="_blank">واتساب للجملة</a>
        <a href="https://t.me/" target="_blank">تليجرام</a>
    </footer>

    <!-- صفحة الحجز -->
    <div class="checkout-container" id="checkoutModal">
        <div class="glass-card" style="max-width: 450px; margin: 20px auto;">
            <h3 style="color: var(--dark-pink);
